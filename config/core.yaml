package_path:
  - "/Users/bananaxiao/Library/Application\ Support/Steam/steamapps/common/RunningWithRifles/RunningWithRifles.app/Contents/Resources/media/packages/vanilla"
  # - "C:\\Program Files (x86)\\Steam\\steamapps\\common\\RunningWithRifles\\media\\packages\\vanilla"
output_format: "json"
pretty_print: true
include_source: false
generate_index_html: true

# Logging configuration
log_level: "DEBUG"       # DEBUG | INFO | WARNING | ERROR | CRITICAL
# log_file: "dist/rwrops.log"  # optional persistent debug log (always DEBUG level)

sort:
  enable: false
  primarykey: "key"
plugin_paths:
  # - "C:\\Users\\hongx\\Documents\\test_sub_plugins"

# AS parser — paths to AngelScript source files (command & exchange extraction)
# Leave blank to skip AS parsing
# as_command_path:  "path/to/scripts/trackers/basic_command_handler.as"
# as_exchange_path: "path/to/scripts/gamemodes/invasion/item_delivery_configurator_invasion.as"

exclude_patterns:
  - models
  - particles
  - scripts.*
  - sounds
  - static_objects

defaults:
  inherit_enabled: true
  base_attr: "inherit_from"
  must_have_attr: ["key"]

entities:
  vehicle:
    selector: "vehicle"
    name: "vehicle"
    is_array: false

    attributes:
      - source: "@name"
        target: "name"
      - source: "@key"
        target: "key"
      - source: "@file"
        target: "inherit_from"
      - source: "@respawn_time"
        target: "respawn_time"
        transform: "to_float"
      - source: "@time_to_live_unsteerable"
        target: "unsteerable_ttl"
        transform: "to_float"
      - source: "@map_view_atlas_index"
        target: "map_index"
        transform: "to_int"
      - source: "@minimum_fill_requirement"
        target: "min_fuel"
        transform: "to_float"
      # 扁平化的 control 属性
      - source: "control/@max_speed"
        target: "max_speed"
        transform: "to_float"
      - source: "control/@acceleration"
        target: "acceleration"
        transform: "to_float"
      - source: "control/@max_reverse_speed"
        target: "max_reverse_speed"
        transform: "to_float"
      - source: "control/@min_health_to_steer"
        target: "min_health_to_steer"
        transform: "to_float"
      - source: "control/@max_rotation"
        target: "max_rotation"
        transform: "to_float"
      - source: "control/@max_water_depth"
        target: "max_water_depth"
        transform: "to_float"
      - source: "control/@steer_smoothening"
        target: "steer_smoothening"
        transform: "to_float"
      # 扁平化的 physics 属性
      - source: "physics/@max_health"
        target: "max_health"
        transform: "to_float"
      - source: "physics/@blast_damage_threshold"
        target: "blast_damage_threshold"
        transform: "to_float"
      - source: "physics/@mass"
        target: "mass"
        transform: "to_float"
      - source: "physics/@broken_mass"
        target: "broken_mass"
        transform: "to_float"
      - source: "physics/@remove_collision_threshold"
        target: "remove_collision_threshold"
        transform: "to_float"
      - source: "physics/@extent"
        target: "extent"
        transform: "parse_vector3"
      - source: "physics/@offset"
        target: "offset"
        transform: "parse_vector3"
      - source: "physics/@top_offset"
        target: "top_offset"
        transform: "parse_vector3"
      - source: "physics/@collision_model_pos"
        target: "collision_model_pos"
        transform: "parse_vector3"
      - source: "physics/@collision_model_extent"
        target: "collision_model_extent"
        transform: "parse_vector3"
      - source: "physics/@visual_offset"
        target: "visual_offset"
        transform: "parse_vector3"
      - source: "physics/@friction_offset"
        target: "friction_offset"
        transform: "to_float"
      - source: "physics/@drag_offset"
        target: "drag_offset"
        transform: "to_float"

    children:
      tags:
        selector: "tag"
        name: "tags"
        is_array: true
        attributes:
          - source: "@name"
            target: "name"

      tire_sets:
        selector: "tire_set"
        name: "tire_sets"
        is_array: true
        attributes:
          - source: "@offset"
            target: "offset"
            transform: "parse_vector3"
          - source: "@radius"
            target: "radius"
            transform: "to_float"

      turrets:
        selector: "turret"
        name: "turrets"
        is_array: true
        # 109 direct children vs 192 with deep search. The extra 83 are the
        # <turret> elements inside <character_slot>, which has its own turrets
        # block below — they were being counted under the vehicle as well.
        deep: false
        attributes:
          - source: "@offset"
            target: "offset"
            transform: "parse_vector3"
          - source: "@weapon_key"
            target: "weapon_key"
          - source: "@weapon_offset"
            target: "weapon_offset"
            transform: "parse_vector3"
          - source: "@weapon_recoil"
            target: "weapon_recoil"
            transform: "to_float"
          - source: "@max_rotation_step"
            target: "max_rotation_step"
            transform: "to_float"
          - source: "@rotation"
            target: "rotation"
            transform: "to_float"
          - source: "@rotation_range"
            target: "rotation_range"
            transform: "to_float"
          - source: "@aim_shoot_threshold"
            target: "aim_shoot_threshold"
            transform: "to_float"

      visuals:
        selector: "visual"
        name: "visuals"
        is_array: true
        attributes:
          - source: "@class"
            target: "class"
          - source: "@key"
            target: "key"
          - source: "@mesh_filename"
            target: "mesh"
          - source: "@texture_filename"
            target: "texture"
          - source: "@texture_atlas_cell"
            target: "texture_atlas_cell"
            transform: "to_int"
          - source: "@turret_index"
            target: "turret_index"
            transform: "to_int"
          - source: "@max_tilt"
            target: "max_tilt"
            transform: "to_float"
          - source: "@offset"
            target: "offset"
            transform: "parse_vector3"

      character_slots:
        selector: "character_slot"
        name: "character_slots"
        is_array: true
        attributes:
          - source: "@type"
            target: "type"
          - source: "@position"
            target: "position"
            transform: "parse_vector3"
          - source: "@rotation"
            target: "rotation"
            transform: "to_float"
          - source: "@exit_rotation"
            target: "exit_rotation"
            transform: "to_float"
          - source: "@hiding"
            target: "hiding"
            transform: "to_float"
          - source: "@attached_on_turret"
            target: "attached_on_turret"
            transform: "to_int"
          - source: "@seat_position"
            target: "seat_position"
            transform: "parse_vector3"
          - source: "@enter_position"
            target: "enter_position"
            transform: "parse_vector3"
          - source: "@animation_key"
            target: "animation_key"
          - source: "@animation_id"
            target: "animation_id"
            transform: "to_int"
          - source: "@marker_offset"
            target: "marker_offset"
            transform: "parse_vector3"
          - source: "@allow_weapon"
            target: "allow_weapon"
            transform: "to_int"
        children:
          weapon_slots:
            selector: "weapon_slot"
            name: "weapon_slots"
            is_array: true
            attributes:
              - source: "@allowed"
                target: "allowed_weapon"
          turrets:
            selector: "turret"
            name: "turrets"
            is_array: true
            attributes:
              - source: "@index"
                target: "index"
                transform: "to_int"

      rev_sounds:
        selector: "rev_sound"
        name: "rev_sounds"
        is_array: true
        attributes:
          - source: "@filename"
            target: "filename"
          - source: "@low_pitch"
            target: "low_pitch"
            transform: "to_float"
          - source: "@high_pitch"
            target: "high_pitch"
            transform: "to_float"
          - source: "@low_rev"
            target: "low_rev"
            transform: "to_float"
          - source: "@high_rev"
            target: "high_rev"
            transform: "to_float"
          - source: "@volume"
            target: "volume"
            transform: "to_float"

      sounds:
        selector: "sound"
        name: "sounds"
        is_array: true
        attributes:
          - source: "@key"
            target: "key"
          - source: "@filename"
            target: "filename"

      effects:
        selector: "effect"
        name: "effects"
        is_array: true
        attributes:
          - source: "@event_key"
            target: "event"
          - source: "@type"
            target: "type"
          - source: "@key"
            target: "key"
          - source: "@surface_tag"
            target: "surface_tag"
          - source: "@size"
            target: "size"
            transform: "to_float"
          - source: "@atlas_index"
            target: "atlas_index"
            transform: "to_int"
          - source: "@layer"
            target: "layer"
            transform: "to_int"
          - source: "@ref"
            target: "ref"
          - source: "@use_surface_color"
            target: "use_surface_color"
            transform: "to_bool"
          - source: "@value"
            target: "value"
            transform: "to_float"
          - source: "@offset"
            target: "offset"
            transform: "parse_vector3"
          - source: "@post_processing"
            target: "post_processing"
            transform: "to_bool"
          - source: "@shadow"
            target: "shadow"
            transform: "to_bool"

      events:
        selector: "event"
        name: "events"
        is_array: true
        attributes:
          - source: "@key"
            target: "key"
        children:
          trigger:
            selector: "trigger"
            name: "trigger"
            is_array: false
            attributes:
              - source: "@class"
                target: "class"
          result:
            selector: "result"
            name: "result"
            is_array: false
            attributes:
              - source: "@class"
                target: "class"
              - source: "@xp"
                target: "xp"
                transform: "to_float"
              - source: "@rp"
                target: "rp"
                transform: "to_float"
              - source: "@instance_class"
                target: "instance_class"
              - source: "@instance_key"
                target: "instance_key"
              - source: "@min_amount"
                target: "min_amount"
                transform: "to_int"
              - source: "@max_amount"
                target: "max_amount"
                transform: "to_int"
              - source: "@offset"
                target: "offset"
                transform: "parse_vector3"
              - source: "@position_spread"
                target: "position_spread"
                transform: "parse_vector2"
              - source: "@direction_spread"
                target: "direction_spread"
                transform: "parse_vector2"
              - source: "@activated"
                target: "activated"
                transform: "to_bool"
  weapon:
    selector: "weapon"
    name: "weapon"
    is_array: false

    attributes:
      - source: "@file"
        target: "inherit_from"
      - source: "@key"
        target: "key"
      - source: "@enabled"
        target: "enabled"
        transform: "to_bool"
      - source: "#text"
        target: "description"
      # 扁平化的 specification 属性
      - source: "specification/@retrigger_time"
        target: "retrigger_time"
        transform: "to_float"
      - source: "specification/@accuracy_factor"
        target: "accuracy_factor"
        transform: "to_float"
      - source: "specification/@sustained_fire_grow_step"
        target: "sustained_fire_grow_step"
        transform: "to_float"
      - source: "specification/@sustained_fire_diminish_rate"
        target: "sustained_fire_diminish_rate"
        transform: "to_float"
      - source: "specification/@magazine_size"
        target: "magazine_size"
        transform: "to_int"
      - source: "specification/@can_shoot_standing"
        target: "can_shoot_standing"
        transform: "to_bool"
      - source: "specification/@suppressed"
        target: "suppressed"
        transform: "to_bool"
      - source: "specification/@name"
        target: "name"
        flatten_to_root: true
      - source: "specification/@class"
        target: "class"
        transform: "to_int"
      - source: "specification/@reload_one_at_a_time"
        target: "reload_one_at_a_time"
        transform: "to_bool"
      - source: "specification/@sight_range_modifier"
        target: "sight_range_modifier"
        transform: "to_float"
      - source: "specification/@projectile_speed"
        target: "projectile_speed"
        transform: "to_float"
      - source: "specification/@projectiles_per_shot"
        target: "projectiles_per_shot"
        transform: "to_int"
      # 扁平化的 model 属性
      - source: "model/@filename"
        target: "model_filename"
      # 扁平化的 hud_icon 属性
      - source: "hud_icon/@filename"
        target: "hud_icon_filename"
      # 扁平化的 inventory 属性
      - source: "inventory/@encumbrance"
        target: "inventory_encumbrance"
        transform: "to_float"
      - source: "inventory/@price"
        target: "inventory_price"
        transform: "to_float"
      - source: "inventory/@buy_price"
        target: "inventory_buy_price"
        transform: "to_float"
      - source: "inventory/@sell_price"
        target: "inventory_sell_price"
        transform: "to_float"
      # 扁平化的 weak_hand_hold 属性
      - source: "weak_hand_hold/@offset"
        target: "weak_hand_hold_offset"
        transform: "to_float"
      # 扁平化的 projectile 属性
      - source: "projectile/@file"
        target: "projectile_file"
      # 扁平化的 projectile/result 属性
      - source: "projectile/result/@class"
        target: "projectile_result_class"
      - source: "projectile/result/@kill_probability"
        target: "projectile_result_kill_probability"
        transform: "to_float"
      - source: "projectile/result/@kill_decay_start_time"
        target: "projectile_result_kill_decay_start_time"
        transform: "to_float"
      - source: "projectile/result/@kill_decay_end_time"
        target: "projectile_result_kill_decay_end_time"
        transform: "to_float"

    children:
      animations:
        selector: "animation"
        name: "animations"
        is_array: true
        attributes:
          - source: "@key"
            target: "key"
          - source: "@ref"
            target: "ref"
            transform: "to_int"
          - source: "@animation_key"
            target: "animation_key"
          - source: "@stance_key"
            target: "stance_key"

      sounds:
        selector: "sound"
        name: "sounds"
        is_array: true
        attributes:
          - source: "@key"
            target: "key"
          - source: "@fileref"
            target: "fileref"
          - source: "@pitch_variety"
            target: "pitch_variety"
            transform: "to_float"
          - source: "@volume"
            target: "volume"
            transform: "to_float"
          - source: "@class"
            target: "class"

      commonness:
        selector: "commonness"
        name: "commonness"
        is_array: false
        attributes:
          - source: "@value"
            target: "value"
            transform: "to_float"
          - source: "@can_respawn_with"
            target: "can_respawn_with"
            transform: "to_bool"
          - source: "@in_stock"
            target: "in_stock"
            transform: "to_bool"

      capacities:
        selector: "capacity"
        name: "capacities"
        is_array: true
        attributes:
          - source: "@value"
            target: "value"
            transform: "to_int"
          - source: "@source"
            target: "source"
          - source: "@source_value"
            target: "source_value"
            transform: "to_float"

      stances:
        selector: "stance"
        name: "stances"
        is_array: true
        attributes:
          - source: "@state_key"
            target: "state_key"
          - source: "@accuracy"
            target: "accuracy"
            transform: "to_float"

      modifiers:
        selector: "modifier"
        name: "modifiers"
        is_array: true
        attributes:
          - source: "@class"
            target: "class"
          - source: "@value"
            target: "value"
            transform: "to_float"

      tags:
        selector: "tag"
        name: "tags"
        is_array: true
        attributes:
          - source: "@name"
            target: "name"

      addon_models:
        selector: "addon_model"
        name: "addon_models"
        is_array: true
        attributes:
          - source: "@filename"
            target: "filename"

      next_in_chains:
        selector: "next_in_chain"
        name: "next_in_chains"
        is_array: true
        attributes:
          - source: "@key"
            target: "key"
          - source: "@share_ammo"
            target: "share_ammo"
            transform: "to_bool"

      ballistics:
        selector: "ballistics"
        name: "ballistics"
        is_array: false
        attributes:
          - source: "@curve_height"
            target: "curve_height"
            transform: "to_float"
          - source: "@near_far_distance"
            target: "near_far_distance"
            transform: "to_float"
          - source: "@speed_estimation_near"
            target: "speed_estimation_near"
            transform: "to_float"
          - source: "@speed_estimation_far"
            target: "speed_estimation_far"
            transform: "to_float"
          - source: "@max_speed"
            target: "max_speed"
            transform: "to_float"
          - source: "@randomness"
            target: "randomness"
            transform: "to_float"
          - source: "@tweak_factor"
            target: "tweak_factor"
            transform: "to_float"

      shields:
        selector: "shield"
        name: "shields"
        is_array: true
        attributes:
          - source: "@offset"
            target: "offset"
            transform: "parse_vector3"
          - source: "@extent"
            target: "extent"
            transform: "parse_vector3"
          - source: "@usable_for_cover"
            target: "usable_for_cover"
            transform: "to_bool"

      drop_on_death_results:
        selector: "drop_on_death_result"
        name: "drop_on_death_results"
        is_array: true
        attributes:
          - source: "@class"
            target: "class"
          - source: "@instance_class"
            target: "instance_class"
          - source: "@instance_key"
            target: "instance_key"
          - source: "@min_amount"
            target: "min_amount"
            transform: "to_int"
          - source: "@max_amount"
            target: "max_amount"
            transform: "to_int"
          - source: "@offset"
            target: "offset"
            transform: "parse_vector3"
          - source: "@position_spread"
            target: "position_spread"
            transform: "parse_vector2"
          - source: "@direction_spread"
            target: "direction_spread"
            transform: "parse_vector2"

  projectile:
    selector: "projectile"
    name: "projectile"
    is_array: false

    attributes:
      - source: "@file"
        target: "inherit_from"
      - source: "@class"
        target: "class"
      - source: "@name"
        target: "name"
        flatten_to_root: true
      - source: "@key"
        target: "key"
      - source: "@slot"
        target: "slot"
        transform: "to_int"
      - source: "@radius"
        target: "radius"
        transform: "to_float"
      - source: "@drop_count_factor_on_death"
        target: "drop_count_factor_on_death"
        transform: "to_float"
      - source: "@drop_count_factor_on_player_death"
        target: "drop_count_factor_on_player_death"
        transform: "to_float"
      - source: "@time_to_live"
        target: "time_to_live"
        transform: "to_float"
      - source: "@time_to_live_out_in_the_open"
        target: "time_to_live_out_in_the_open"
        transform: "to_float"
      - source: "@pulldown_in_air"
        target: "pulldown_in_air"
        transform: "to_float"
      - source: "@on_ground_up"
        target: "on_ground_up"
        transform: "parse_vector3"
      - source: "@can_be_disarmed"
        target: "can_be_disarmed"
        transform: "to_int"
      - source: "@can_be_detected_by_driver"
        target: "can_be_detected_by_driver"
        transform: "to_int"
      - source: "@can_be_detected_by_footmen"
        target: "can_be_detected_by_footmen"
        transform: "to_int"
      - source: "@use_time_to_live"
        target: "use_time_to_live"
        transform: "to_int"
      - source: "@drop_count_limit_in_range"
        target: "drop_count_limit_in_range"
        transform: "to_int"
      # 扁平化的 hud_icon 属性
      - source: "hud_icon/@filename"
        target: "hud_icon_filename"
      # 扁平化的 result 属性
      - source: "result/@class"
        target: "result_class"
      - source: "result/@key"
        target: "result_key"
      - source: "result/@radius"
        target: "result_radius"
        transform: "to_float"
      - source: "result/@damage"
        target: "result_damage"
        transform: "to_float"
      - source: "result/@push"
        target: "result_push"
        transform: "to_float"
      - source: "result/@character_state"
        target: "result_character_state"
      - source: "result/@decal"
        target: "result_decal"
      # 扁平化的 model 属性
      - source: "model/@mesh_filename"
        target: "model_mesh"
      # 扁平化的 throwable 属性
      - source: "throwable/@curve_height"
        target: "throwable_curve_height"
        transform: "to_float"
      - source: "throwable/@near_far_distance"
        target: "throwable_near_far_distance"
        transform: "to_float"
      - source: "throwable/@speed_estimation_near"
        target: "throwable_speed_estimation_near"
        transform: "to_float"
      - source: "throwable/@speed_estimation_far"
        target: "throwable_speed_estimation_far"
        transform: "to_float"
      - source: "throwable/@max_speed"
        target: "throwable_max_speed"
        transform: "to_float"
      - source: "throwable/@randomness"
        target: "throwable_randomness"
        transform: "to_float"
      # 扁平化的 trigger 属性
      - source: "trigger/@class"
        target: "trigger_class"
      - source: "trigger/@time_to_live"
        target: "trigger_time_to_live"
        transform: "to_float"

    children:
      tags:
        selector: "tag"
        name: "tags"
        is_array: true
        attributes:
          - source: "@name"
            target: "name"
      project_sounds:
        selector: "sound"
        name: "sounds"
        is_array: true
        attributes:
          - source: "@class"
            target: "class"
          - source: "@key"
            target: "key"
          - source: "@fileref"
            target: "fileref"
          - source: "@tag"
            target: "tag"
          - source: "@copy"
            target: "copy"
          - source: "@pitch_variety"
            target: "pitch_variety"
            transform: "to_float"
          - source: "@volume"
            target: "volume"
            transform: "to_float"
      project_effects:
        selector: "effect"
        name: "effects"
        is_array: true
        attributes:
          - source: "@class"
            target: "class"
          - source: "@key"
            target: "key"
          - source: "@ref"
            target: "ref"
          - source: "@tag"
            target: "tag"
          - source: "@use_surface_color"
            target: "use_surface_color"
            transform: "to_bool"
          - source: "@post_processing"
            target: "post_processing"
            transform: "to_bool"
          - source: "@lighting"
            target: "lighting"
            transform: "to_bool"
          - source: "@additive"
            target: "additive"
            transform: "to_bool"
          - source: "@type"
            target: "type"
          - source: "@size"
            target: "size"
